name: CI
on:
  # No `paths:` filter, deliberately.
  #
  # ShellCheck and Tests are REQUIRED status checks on main. A path filter means
  # they never run for a change outside the filter — and a check that is required
  # but never reported blocks the pull request forever, not temporarily. A
  # docs-only PR touching skills/ sat unmergeable in exactly that state, showing
  # "0 checks" and BLOCKED, with nothing to wait for and nothing to re-run.
  #
  # The filter was saving about a minute of CI. It cost a permanently stuck PR
  # and an afternoon working out why. Required checks and path filters should not
  # be combined; if the cost ever matters, make the jobs exit early instead, so
  # they still report.
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
          severity: warning
      - run: shellcheck --severity=warning run_tests.sh
      - run: shellcheck --severity=warning -x tests/test_helper.bash

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq xxd
      - name: Verify Ed25519 support
        run: openssl genpkey -algorithm Ed25519 -out /tmp/test-ed25519.pem 2>/dev/null && echo "Ed25519 OK" && rm /tmp/test-ed25519.pem
      - name: Run unit tests
        run: npx bats --formatter tap tests/unit/
      - name: Run integration tests
        run: npx bats --formatter tap tests/integration/
