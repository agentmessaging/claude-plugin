name: CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'run_tests.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
      - '.shellcheckrc'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'run_tests.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
      - '.shellcheckrc'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
          severity: warning
      - run: shellcheck --severity=warning run_tests.sh
      - run: shellcheck --severity=warning -x tests/test_helper.bash

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq xxd
      - name: Verify Ed25519 support
        run: openssl genpkey -algorithm Ed25519 -out /tmp/test-ed25519.pem 2>/dev/null && echo "Ed25519 OK" && rm /tmp/test-ed25519.pem
      - name: Run unit tests
        run: npx bats --formatter tap tests/unit/
      - name: Run integration tests
        run: npx bats --formatter tap tests/integration/
